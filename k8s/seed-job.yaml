apiVersion: batch/v1
kind: Job
metadata:
  generateName: toil-budget-seed-
  namespace: toil-budget
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: toil-budget:local
          imagePullPolicy: IfNotPresent
          command: [python, -m, seed.generate, --seed, "42", --months, "6"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: toil-budget-db
                  key: url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
