---
metadata:
  version: "v1"
fault:
  - entity:
      name: frontend
      kind: Service
    condition: High error rate
    category: Resource Unavailable
    fault_mechanism: custom(flagd)
  - entity:
      name: checkout
      kind: Service
    condition: High error rate
    category: Resource Unavailable
    fault_mechanism: custom(flagd)
  - entity:
      name: payment
      kind: Service
    condition: High error rate
    category: Resource Unavailable
    fault_mechanism: custom(flagd)
  - entity:
      name: flagd-config
      kind: ConfigMap
      changed:
        element: data.demo\\.flagd\\.json
        from: "{\n  \"$schema\": \"https://flagd.dev/schema/v0/flags.json\",\n  \"flags\": {\n    \"productCatalogFailure\": {\n      \"description\": \"Fail product catalog service on a specific product\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"recommendationCacheFailure\": {\n      \"description\": \"Fail recommendation service cache\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"adManualGc\": {\n      \"description\": \"Triggers full manual garbage collections in the ad service\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"adServiceHighCpu\": {\n      \"description\": \"Triggers high cpu load in the ad service\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"adFailure\": {\n      \"description\": \"Fail ad service\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"kafkaQueueProblems\": {\n      \"description\": \"Overloads Kafka queue while simultaneously introducing a consumer side delay leading to a lag spike\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": 100,\n        \"off\": 0\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"cartFailure\": {\n      \"description\": \"Fail cart service\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"paymentFailure\": {\n      \"description\": \"Fail payment service charge requests\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"paymentUnreachable\": {\n      \"description\": \"Payment service is unavailable\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"loadgeneratorFloodHomepage\": {\n      \"description\": \"Flood the frontend with a large amount of requests.\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": 100,\n        \"off\": 0\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"imageSlowLoad\": {\n      \"description\": \"slow loading images in the frontend\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"10sec\": 10000,\n        \"5sec\": 5000,\n        \"off\": 0\n      },\n      \"defaultVariant\": \"off\"\n    }\n  }\n}\n"
        to: "{\n  \"$schema\": \"https://flagd.dev/schema/v0/flags.json\",\n  \"flags\": {\n    \"productCatalogFailure\": {\n      \"description\": \"Fail product catalog service on a specific product\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"recommendationCacheFailure\": {\n      \"description\": \"Fail recommendation service cache\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"adManualGc\": {\n      \"description\": \"Triggers full manual garbage collections in the ad service\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"adServiceHighCpu\": {\n      \"description\": \"Triggers high cpu load in the ad service\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"adFailure\": {\n      \"description\": \"Fail ad service\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"on\"\n    },\n    \"kafkaQueueProblems\": {\n      \"description\": \"Overloads Kafka queue while simultaneously introducing a consumer side delay leading to a lag spike\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": 100,\n        \"off\": 0\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"cartFailure\": {\n      \"description\": \"Fail cart service\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"paymentFailure\": {\n      \"description\": \"Fail payment service charge requests\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"on\"\n    },\n    \"paymentUnreachable\": {\n      \"description\": \"Payment service is unavailable\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": true,\n        \"off\": false\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"loadgeneratorFloodHomepage\": {\n      \"description\": \"Flood the frontend with a large amount of requests.\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"on\": 100,\n        \"off\": 0\n      },\n      \"defaultVariant\": \"off\"\n    },\n    \"imageSlowLoad\": {\n      \"description\": \"slow loading images in the frontend\",\n      \"state\": \"ENABLED\",\n      \"variants\": {\n        \"10sec\": 10000,\n        \"5sec\": 5000,\n        \"off\": 0\n      },\n      \"defaultVariant\": \"off\"\n    }\n  }\n}\n"
    condition: paymentSeriveFailure and adFailure feature flag set
    category: Configuration Setting
    fault_mechanism: custom(flagd)
alerts:
  - id: RequestErrorRate
    group_id: frontend-service-1
    metadata:
      description: Error Rate is Above Threshold
  - id: RequestErrorRate
    group_id: checkout-service-2
    metadata:
      description: Error Rate is Above Threshold
    group_id: payment-service-2
  - id: RequestErrorRate
    group_id: checkout-service-2
    metadata:
      description: Error Rate is Above Threshold
groups:
  - id: flagd-config-1
    kind: ConfigMap
    name: flagd-config
    namespace: otel-demo
    root_cause: true
  - id: flagd-pod-1
    kind: Pod
    namespace: otel-demo
    filter:
      - flagd-.*
  - id: flagd-service-1
    kind: Service
    namespace: otel-demo
    filter: 
    - flagd
  - id: getads-endpoint-1
    kind: ServiceOperation
    filter:
      - ad-.*_Ad_GetAds
    namespace: otel-demo
  - id: ad-service-1
    kind: Service
    filter: 
    - ad
    namespace: otel-demo
  - id: frontend-service-1
    kind: Service
    filter: 
    - frontend\b
    namespace: otel-demo
  - id: ad-pod-1
    kind: Pod
    namespace: otel-demo
    filter:
      - ad-.*
  - id: frontend-pod-1
    kind: Pod
    namespace: otel-demo
    filter:
      - frontend-.*
  - id: charge-endpoint-2
    kind: ServiceOperation
    namespace: otel-demo
    filter:
    - checkout-.*_PaymentService_Charge
  - id: payment-service-2
    kind: Service
    filter: 
    - payment
    namespace: otel-demo
  - id: checkout-service-2
    kind: Service
    filter: 
    - .checkout
    namespace: otel-demo
  - id: checkout-pod-2
    kind: Pod
    namespace: otel-demo
    filter:
      - checkout-.*
  - id: payment-pod-2
    kind: Pod
    namespace: otel-demo
    filter:
      - payment-.*
aliases:
  - - flagd-pod-1
    - flagd-service-1
  - - ad-service-1
    - ad-pod-1
    - getads-endpoint-1
  - - frontend-service-1
    - frontend-pod-1
  - - checkout-service-2
    - checkout-pod-2
  - - payment-service-2
    - payment-pod-2
propagations:
  - source: flagd-config-1
    target: flagd-service-1
    condition: flagd-config ConfigMap adFailure feature flag set and paymentFailure feature flag set
    effect: flagd enables injection
  - source: flagd-service-1
    target: getads-endpoint-1
    condition: flagd enables injection
    effect: getads endpoint Error Rate is Above Threshold
  - source: getads-endpoint-1
    target: ad-service-1
    condition: getads endpoint Error Rate is Above Threshold
    effect: ad service Error Rate is Above Threshold
  - source: ad-service-1
    target: frontend-service-1
    condition: ad service Error Rate is Above Threshold
    effect: frontend service Error Rate is Above Threshold
  - source: flagd-service-1
    target: charge-endpoint-2
    condition: flagd enables injection
    effect: charge endpoint Error Rate is Above Threshold
  - source: charge-endpoint-2
    target: payment-service-2
    condition: charge endpoint Error Rate is Above Threshold
    effect: payment service Error Rate is Above Threshold
  - source: payment-service-2
    target: checkout-service-2
    condition: payment service Error Rate is Above Threshold
    effect: checkout service Error Rate is Above Threshold
  - source: checkout-service-2
    target: frontend-service-1
    condition: checkout service Error Rate is Above Threshold
    effect: frontend service Error Rate is Above Threshold
recommended_actions:
  - solution:
      id: Disable_adFailure_feature_flag
      actions:
        - Disable adFailure feature flag
  - solution:
      id: Disable_PaymentFailure_feature_flag
      actions:
        - Disable PaymentFailure feature flag
