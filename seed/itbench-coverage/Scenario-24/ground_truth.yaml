---
metadata:
  version: "v1"
fault:
  - entity:
      name: checkout-deployment
      group_id: checkout-deployment
      kind: Deployment
    condition: Checkout deployment has misconfigured KAFKA_ADDR environment variable pointing to wrong port 9999
    category: Configuration
    fault_mechanism: environment_variable_misconfiguration
alerts:
  - id: KafkaConnectionClosureRate
    group_id: checkout-service-1
    metadata:
      description: Checkout service unable to connect to Kafka due to misconfigured port
  - id: RequestLatency
    group_id: checkout-service-1
    metadata:
      description: Checkout service experiencing increased latency due to Kafka connection failures
groups:
  - id: checkout-deployment
    kind: Deployment
    filter:
      - checkout\b
    namespace: otel-demo
    root_cause: true
  - id: checkout-pod-1
    kind: Pod
    filter:
      - checkout-.*
    namespace: otel-demo
  - id: checkout-service-1
    kind: Service
    filter:
      - checkout\b
    namespace: otel-demo
  - id: kafka-service-1
    kind: Service
    filter:
      - kafka\b
    namespace: otel-demo
aliases:
  - - checkout-service-1
    - checkout-pod-1
propagations:
  - source: checkout-deployment
    target: checkout-pod-1
    condition: Deployment configuration specifies incorrect Kafka port 9999 instead of correct port
    effect: Checkout pods cannot establish connections to Kafka on the wrong port
  - source: checkout-pod-1
    target: checkout-service-1
    condition: Checkout pods fail to connect to Kafka due to misconfigured environment variable
    effect: Checkout service cannot publish order events to Kafka, but continues processing orders
  - source: checkout-service-1
    target: kafka-service-1
    condition: Checkout service attempts to connect to Kafka on wrong port 9999
    effect: Order events are not published to Kafka queue, downstream services miss order notifications
recommended_actions:
  - solution:
      id: fix_kafka_environment_variable
      actions:
        - Correct KAFKA_ADDR environment variable in checkout deployment to use the correct Kafka port