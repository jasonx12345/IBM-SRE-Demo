# Generated by python -m prometheus.generate_rules; edit config/slo.yaml.
groups:
- name: toil-budget-slo-recording
  rules:
  - record: toil_budget:api_error_ratio:1h
    expr: (sum(rate(toil_budget_http_requests_total{job="toil-budget",scope="api",status=~"5.."}[1h]))
      or vector(0)) / clamp_min(sum(rate(toil_budget_http_requests_total{job="toil-budget",scope="api"}[1h])),
      1e-9)
  - record: toil_budget:api_slow_ratio:1h
    expr: clamp_min(sum(rate(toil_budget_http_request_duration_seconds_count{job="toil-budget",scope="api"}[1h]))
      - sum(rate(toil_budget_http_request_duration_seconds_bucket{job="toil-budget",scope="api",le="0.3"}[1h])),
      0) / clamp_min(sum(rate(toil_budget_http_request_duration_seconds_count{job="toil-budget",scope="api"}[1h])),
      1e-9)
  - record: toil_budget:api_error_ratio:30m
    expr: (sum(rate(toil_budget_http_requests_total{job="toil-budget",scope="api",status=~"5.."}[30m]))
      or vector(0)) / clamp_min(sum(rate(toil_budget_http_requests_total{job="toil-budget",scope="api"}[30m])),
      1e-9)
  - record: toil_budget:api_slow_ratio:30m
    expr: clamp_min(sum(rate(toil_budget_http_request_duration_seconds_count{job="toil-budget",scope="api"}[30m]))
      - sum(rate(toil_budget_http_request_duration_seconds_bucket{job="toil-budget",scope="api",le="0.3"}[30m])),
      0) / clamp_min(sum(rate(toil_budget_http_request_duration_seconds_count{job="toil-budget",scope="api"}[30m])),
      1e-9)
  - record: toil_budget:api_error_ratio:5m
    expr: (sum(rate(toil_budget_http_requests_total{job="toil-budget",scope="api",status=~"5.."}[5m]))
      or vector(0)) / clamp_min(sum(rate(toil_budget_http_requests_total{job="toil-budget",scope="api"}[5m])),
      1e-9)
  - record: toil_budget:api_slow_ratio:5m
    expr: clamp_min(sum(rate(toil_budget_http_request_duration_seconds_count{job="toil-budget",scope="api"}[5m]))
      - sum(rate(toil_budget_http_request_duration_seconds_bucket{job="toil-budget",scope="api",le="0.3"}[5m])),
      0) / clamp_min(sum(rate(toil_budget_http_request_duration_seconds_count{job="toil-budget",scope="api"}[5m])),
      1e-9)
  - record: toil_budget:api_error_ratio:6h
    expr: (sum(rate(toil_budget_http_requests_total{job="toil-budget",scope="api",status=~"5.."}[6h]))
      or vector(0)) / clamp_min(sum(rate(toil_budget_http_requests_total{job="toil-budget",scope="api"}[6h])),
      1e-9)
  - record: toil_budget:api_slow_ratio:6h
    expr: clamp_min(sum(rate(toil_budget_http_request_duration_seconds_count{job="toil-budget",scope="api"}[6h]))
      - sum(rate(toil_budget_http_request_duration_seconds_bucket{job="toil-budget",scope="api",le="0.3"}[6h])),
      0) / clamp_min(sum(rate(toil_budget_http_request_duration_seconds_count{job="toil-budget",scope="api"}[6h])),
      1e-9)
- name: toil-budget-slo-alerts
  rules:
  - alert: ToilBudgetAvailabilityFastBurn
    expr: (toil_budget:api_error_ratio:1h > 0.144) and (toil_budget:api_error_ratio:5m
      > 0.144)
    for: 2m
    labels:
      severity: critical
      service: toil-budget
      slo: error
    annotations:
      summary: Toil Budget API availability SLO burning at >14.4x
      description: Both 1h and 5m exceed the burn threshold. Check app logs, DB readiness,
        CPU/memory and request latency. See docs/OPERATIONS.md.
  - alert: ToilBudgetLatencyFastBurn
    expr: (toil_budget:api_slow_ratio:1h > 0.144) and (toil_budget:api_slow_ratio:5m
      > 0.144)
    for: 2m
    labels:
      severity: critical
      service: toil-budget
      slo: slow
    annotations:
      summary: Toil Budget API latency SLO burning at >14.4x
      description: Both 1h and 5m exceed the burn threshold. Check app logs, DB readiness,
        CPU/memory and request latency. See docs/OPERATIONS.md.
  - alert: ToilBudgetAvailabilitySlowBurn
    expr: (toil_budget:api_error_ratio:6h > 0.06) and (toil_budget:api_error_ratio:30m
      > 0.06)
    for: 15m
    labels:
      severity: warning
      service: toil-budget
      slo: error
    annotations:
      summary: Toil Budget API availability SLO burning at >6x
      description: Both 6h and 30m exceed the burn threshold. Check app logs, DB readiness,
        CPU/memory and request latency. See docs/OPERATIONS.md.
  - alert: ToilBudgetLatencySlowBurn
    expr: (toil_budget:api_slow_ratio:6h > 0.06) and (toil_budget:api_slow_ratio:30m
      > 0.06)
    for: 15m
    labels:
      severity: warning
      service: toil-budget
      slo: slow
    annotations:
      summary: Toil Budget API latency SLO burning at >6x
      description: Both 6h and 30m exceed the burn threshold. Check app logs, DB readiness,
        CPU/memory and request latency. See docs/OPERATIONS.md.
  - alert: ToilBudgetUnavailable
    expr: up{job="toil-budget"} == 0 or toil_budget_database_up{job="toil-budget"}
      == 0
    for: 2m
    labels:
      severity: critical
      service: toil-budget
    annotations:
      summary: Toil Budget app or database is unavailable
      description: Inspect /readyz, PostgreSQL health and app logs. See docs/OPERATIONS.md.
